<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="assets/icon/flavicon.png" type="image/png">
    <link rel="stylesheet" href="css/cadastro.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <title>Loxen - Cadastro Usuário</title>
</head>

<body>

    <div class="cadastro_usuario">
        <a href="Dashboard.html" class="voltar">
            <img src="./assets/img/arrow-left.png">
        </a>
        <div class="info">
            <div class="popUp">
                <span class="popUp-icon" id="icon">⚠️</span>

                <div class="popUp-conteudo">
                    <h3 id="popUpTitulo">Falha ao realizar cadastro de usuário</h3>
                    <p id="popUpTexto"></p>
                </div>
            </div>

            <div class="formulario">
                <img src="assets/icon/logo.png" alt="Logo">
                <h3>Cadastro de Usuário</h3>
                <input type="text" id="ipt_codigo" placeholder="Código de Ativação">
                <input type="text" id="ipt_nome_usuario" placeholder="Nome">
                <input type="text" id="ipt_email" placeholder="Email">

                <select id="slt_cargo">
                    <option value="0" disabled selected>Selecione o Cargo</option>
                    <option value="Funcionário">Funcionário</option>
                    <option value="Gerente">Gerente</option>
                    <option value="Administrador">Administrador</option>
                </select>

                <div oninput="validar()" class="validacao-campo">
                    <input type="password" id="ipt_senha" placeholder="Senha">
                    <i class="fa-solid fa-eye olho" onclick="mostrar()"></i>
                    <div id="validacao" class="validacao"></div>
                </div>

                <div oninput="senhasCoincidem()" class="validacao-campo">
                    <input type="password" id="ipt_senha_confirmada" placeholder="Insira novamente sua Senha">
                    <i class="fa-solid fa-eye olho" onclick="mostrar2()"></i>
                    <div id="validacao2" class="validacao2"></div>
                </div>


                <button onclick="registrar()">Registrar</button>
            </div>
        </div>

        <div class="painel">
            <h1>Venha começar sua <br> jornada conosco</h1>
        </div>
    </div>

</body>

</html>
<script>
    const popup = document.querySelector('.popUp');
    let validacaoFeita = false;

    function registrar() {

        validar();
        senhasCoincidem();

        let codigo = ipt_codigo.value;
        let nome = ipt_nome_usuario.value;
        let email = ipt_email.value;
        let cargo = slt_cargo.value;
        let senha = ipt_senha.value;
        let senhaConfirmada = ipt_senha_confirmada.value;

        let verificacaoEmailArroba = email.indexOf('@');
        let verificacaoEmailPonto = email.indexOf('.');

        if (
            codigo == '' ||
            nome == '' ||
            email == '' ||
            cargo == 0 ||
            senha == '' ||
            senhaConfirmada == ''
        ) {
            icon.innerHTML = "⚠️";
            popUpTitulo.innerHTML = "Falha ao realizar cadastro de usuário";
            popUpTexto.innerHTML = "Todos os campos devem ser preenchidos para o cadastro!";
            popup.classList.add("ativo");

            setTimeout(() => {
                popup.classList.remove("ativo");
            }, 3000);

            return;
        }

        if (verificacaoEmailArroba == -1 || verificacaoEmailPonto == -1) {
            icon.innerHTML = "⚠️";
            popUpTitulo.innerHTML = "Falha ao realizar cadastro de usuário";
            popUpTexto.innerHTML = "Insira um Email válido";
            popup.classList.add("ativo");

            setTimeout(() => {
                popup.classList.remove("ativo");
            }, 3000);

            return;
        }

        if (senha != senhaConfirmada) {
            icon.innerHTML = "⚠️";
            popUpTitulo.innerHTML = "Falha ao realizar cadastro de usuário";
            popUpTexto.innerHTML = "As senhas devem coincidir";
            popup.classList.add("ativo");

            setTimeout(() => {
                popup.classList.remove("ativo");
            }, 3000);

            return;
        }

        if (!validacaoFeita) {
            icon.innerHTML = "⚠️";
            popUpTitulo.innerHTML = "Falha ao realizar cadastro de usuário";
            popUpTexto.innerHTML = "A senha não atende aos requisitos mínimos";
            popup.classList.add("ativo");

            setTimeout(() => {
                popup.classList.remove("ativo");
            }, 3000);

            return;
        }

        fetch("/usuarios/cadastrar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
            },
            body: JSON.stringify({
                nomeServer: nome,
                cargoServer: cargo,
                emailServer: email,
                senhaServer: senha,
                codigoServer: codigo,
            }),
        })
            .then(async (resposta) => {

                const dados = await resposta.json();

                if (!resposta.ok) {
                    throw new Error(dados.mensagem);
                }

                return dados;
            })
            .then(() => {

                icon.innerHTML = "✅";
                popUpTitulo.innerHTML = "Cadastro realizado com sucesso!";
                popUpTexto.innerHTML = "";

                popup.classList.add("ativo");

                setTimeout(() => {
                    popup.classList.remove("ativo");
                }, 3000);

                ipt_codigo.value = '';
                ipt_nome_usuario.value = '';
                ipt_email.value = '';
                slt_cargo.selectedIndex = 0;
                ipt_senha.value = '';
                ipt_senha_confirmada.value = '';
                validacao.innerHTML = '';
                validacao2.innerHTML = '';
                validacaoFeita = false;

            })
            .catch((erro) => {

                icon.innerHTML = "⚠️";
                popUpTitulo.innerHTML = "Falha ao realizar cadastro";

                if (erro.message == "Código de ativação inválido") {
                    popUpTexto.innerHTML = "O código informado não pertence a nenhuma filial.";
                } else {
                    popUpTexto.innerHTML = erro.message;
                }

                popup.classList.add("ativo");

                setTimeout(() => {
                    popup.classList.remove("ativo");
                }, 3000);
            });

        return false;
    }

    function validar() {
        let senha = ipt_senha.value;

        let temMaiuscula = /[A-Z]/.test(senha);
        let temMinuscula = /[a-z]/.test(senha);
        let temEspecial = /[!@#$%&*~;.,\/+\-=|]/.test(senha);

        if (senha.length < 8) {
            validacao.innerHTML = 'A senha precisa ter no mínimo 8 caracteres';
            validacaoFeita = false;

        } else if (!temMinuscula) {
            validacao.innerHTML = 'A senha precisa conter ao menos uma letra minúscula';
            validacaoFeita = false;

        } else if (!temMaiuscula) {
            validacao.innerHTML = 'A senha precisa conter ao menos uma letra maiúscula';
            validacaoFeita = false;

        } else if (!temEspecial) {
            validacao.innerHTML = 'A senha precisa ter pelo menos um caractere especial';
            validacaoFeita = false;

        } else {
            validacao.innerHTML = '';
            validacaoFeita = true;
        }
    }

    function senhasCoincidem() {
        let senha = ipt_senha.value;
        let senhaConfirmada = ipt_senha_confirmada.value;

        if (senhaConfirmada.length == 0) {
            validacao2.innerHTML = '';
            return;
        }

        if (senha != senhaConfirmada) {
            validacao2.innerHTML = 'As senhas não coincidem';
        } else {
            validacao2.innerHTML = '';
        }
    }

    function mostrar() {
        if (ipt_senha.type === "password") {
            ipt_senha.type = "text";
        } else {
            ipt_senha.type = "password";
        }
    }

    function mostrar2() {
        if (ipt_senha_confirmada.type === "password") {
            ipt_senha_confirmada.type = "text";
        } else {
            ipt_senha_confirmada.type = "password";
        }
    }
</script>
